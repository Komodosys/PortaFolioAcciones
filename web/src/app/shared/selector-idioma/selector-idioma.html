<ng-container *transloco="let t">
  <label class="flex items-center gap-2">
    <span class="text-[11px] font-bold uppercase tracking-wide text-slate-400">
      {{ t('menu.idioma') }}
    </span>

    <select
      class="select select-bordered select-sm font-medium text-slate-600"
      [value]="activo()"
      (change)="cambiar($any($event.target).value)"
      [attr.aria-label]="t('menu.idioma')"
    >
      @for (idioma of disponibles; track idioma.codigo) {
        <option [value]="idioma.codigo">{{ idioma.nombre }}</option>
      }
    </select>
  </label>
</ng-container>
