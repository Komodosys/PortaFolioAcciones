<!doctype html>
<!--
  El atributo `lang` se queda en espanol como valor inicial. La aplicacion lo cambia en cuanto sabe la
  preferencia de la persona: es un requisito de accesibilidad, porque de el dependen la lectura en voz
  alta y el diccionario del navegador.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>PortaFolioAcciones</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!--
    Montserrat, la misma tipografía que WinCuentas y desde el mismo sitio. Va por enlace y no en el
    repositorio porque son seis anchos distintos con sus cursivas: empaquetarla engordaría la aplicación
    varias veces para ahorrar una petición.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
